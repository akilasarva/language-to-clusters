# Town05 on THREE axes: topology, surface, and the terrain a region sits in.
#
# WHY THREE. `path` says what a space DOES; it says nothing about what it is made of. The
# pedestrian corpus keeps asking for the second thing -- "stay on the walkway", "never
# cross the grass" -- and mapping those onto topology is an approximation, not a reading:
# a paved plaza is open_space and is not grass. With surface as its own axis the two
# compose instead of colliding, under the same rule the sidewalk map uses: UNION within an
# axis, INTERSECTION across.
#
# grass comes from CityObjectLabel.Terrain (208 objects) and Vegetation (4894), by testing
# each region centroid against their bounding boxes. 15 regions sit inside one.
# It is not an OpenDRIVE lane type -- grass is world geometry -- so unlike sidewalk this
# needs a live server to extract.
#
# THE PROHIBITION BINDS, which is what makes it a test rather than a label: from region 0,
# the shortest route to 35 is [0,64,25,11,35] and crosses grass at 11; forbidding grass
# leaves [0,63,62,61,46,36,35], seven hops. Obeying it costs something and disobeying it
# is possible.
environment: carla_town05_terrain
axes:
  path:     topology
  junction: topology
  sidewalk: surface
  asphalt:  surface
  grass:    surface
